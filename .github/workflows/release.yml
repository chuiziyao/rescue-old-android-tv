name: Build APKs & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK (use runner preinstalled)
        shell: pwsh
        run: |
          $candidates = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT,
                          "C:\Android\android-sdk", "$env:LOCALAPPDATA\Android\Sdk")
          $sdk = $candidates | Where-Object { $_ -and (Test-Path (Join-Path $_ "build-tools")) } | Select-Object -First 1
          if (-not $sdk) { throw "Android SDK not found on runner" }
          Write-Host "SDK=$sdk"
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          $sm = Get-ChildItem (Join-Path $sdk "cmdline-tools") -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sm) {
            & $sm.FullName --sdk_root=$sdk "platforms;android-35" "build-tools;34.0.0" "platform-tools"
            Write-Host "sdkmanager exit=$LASTEXITCODE"
          } else {
            Write-Host "sdkmanager not found, use preinstalled packages"
          }
          Get-ChildItem (Join-Path $sdk "build-tools") -Directory | Select-Object Name
          Get-ChildItem (Join-Path $sdk "platforms") -Directory | Select-Object Name

      - name: Diagnose toolchain
        shell: pwsh
        run: |
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          Get-Command python, java, aapt2 -ErrorAction SilentlyContinue | Format-Table Name, Source
          python --version 2>&1
          java -version 2>&1
          Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem "$env:ANDROID_HOME\platforms" -Directory -ErrorAction SilentlyContinue | Select-Object Name

      - name: Build WushuangADB + WushuangDesktop
        shell: pwsh
        run: |
          $dbg = "ci-debug.txt"
          "start" | Set-Content $dbg
          Start-Transcript -Path build.log -Force | Out-Null
          $ok = $false
          try {
            $distAbs = Join-Path $PWD "dist"
            ./scripts/build_assets.ps1 -OutDir $distAbs 2>&1 | Tee-Object -FilePath build.out
            "script returned" | Add-Content $dbg
            $ok = $true
          } catch {
            "catch: $($_.Exception.Message)" | Add-Content $dbg
            Write-Host "BUILD FAILED: $($_.Exception.Message)"
            Write-Host $_.ScriptStackTrace
          } finally {
            Stop-Transcript | Out-Null
          }
          "ok=$ok LASTEXITCODE=$LASTEXITCODE" | Add-Content $dbg
          Get-ChildItem dist -ErrorAction SilentlyContinue | ForEach-Object { "file: $($_.Name) $($_.Length)" } | Add-Content $dbg
          if (-not (Test-Path dist/WushuangADB.apk) -or -not (Test-Path dist/WushuangDesktop.apk)) {
            "missing apk" | Add-Content $dbg
            exit 1
          }
          "reaching exit 0" | Add-Content $dbg
          exit 0

      - name: Report failure to commit comment
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $body = ""
          if (Test-Path ci-debug.txt) {
            $body = (Get-Content ci-debug.txt -ErrorAction SilentlyContinue) -join "`n"
          }
          if (-not $body -and (Test-Path build.out)) {
            $body = (Get-Content build.out -Tail 120 -ErrorAction SilentlyContinue) -join "`n"
          }
          if (-not $body -and (Test-Path build.log)) {
            $body = (Get-Content build.log -Tail 120 -ErrorAction SilentlyContinue) -join "`n"
          }
          if (-not $body) { $body = "no debug info captured" }
          $payload = @{ body = "CI build failed. log tail:`n``````n$body`n``````" } | ConvertTo-Json -Depth 3
          $uri = "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"
          try {
            Invoke-RestMethod -Method Post -Uri $uri -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } -Body $payload -ContentType "application/json" | Out-Null
            Write-Host "comment posted"
          } catch {
            Write-Host "comment failed: $($_.Exception.Message)"
          }

      - name: Show built APKs
        shell: pwsh
        run: |
          Get-ChildItem dist/*.apk | Select-Object Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wushuang-apks
          path: dist/*.apk

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
