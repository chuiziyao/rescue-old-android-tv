name: Cleanup Old Releases

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete broken tags and releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for t in v1.4.0 v1.4.1 v1.4.2 v1.4.3 v1.4.4 v1.4.5 v1.4.6; do
            echo "cleanup $t"
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$t" || true
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$t" || true
          done
          echo done
